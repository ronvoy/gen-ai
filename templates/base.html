<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LAMBADA Benchmark{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f7f8fa; }
    .navbar-brand { font-weight: 600; letter-spacing: .2px; }
    main { max-width: 1100px; }
    .card { border: 1px solid #e6e8ec; }
    .metric-value { font-size: 1.6rem; font-weight: 600; }
    .metric-label { color: #6c757d; font-size: .85rem; }
    pre code { display: block; padding: 1rem; background: #f1f3f5; border-radius: 6px; overflow-x: auto; }
    .terminal {
      background: #0d1117; color: #c9d1d9; border: 1px solid #21262d; border-radius: 6px;
      font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: .78rem; line-height: 1.5; padding: .65rem .9rem;
      height: 200px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    }
    .terminal .t-line { display: block; }
    .terminal .t-ok { color: #3fb950; }
    .terminal .t-bad { color: #f85149; }
    .terminal .t-muted { color: #8b949e; }
    .terminal-header {
      background: #161b22; border: 1px solid #21262d; border-bottom: 0;
      border-radius: 6px 6px 0 0; color: #8b949e; font-size: .75rem;
      padding: .3rem .9rem; display: flex; align-items: center; gap: .5rem;
    }
    .terminal-header .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .terminal-header + .terminal { border-radius: 0 0 6px 6px; }
    .blink { animation: blink 1.1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .report { font-size: .95rem; line-height: 1.6; color: #212529; }
    .report h1 { font-size: 1.7rem; font-weight: 600; margin: .25rem 0 1rem; }
    .report h2 { font-size: 1.3rem; font-weight: 600; margin: 2rem 0 .75rem; padding-bottom: .35rem; border-bottom: 1px solid #e6e8ec; }
    .report h3 { font-size: 1.12rem; font-weight: 600; margin: 1.5rem 0 .5rem; }
    .report h4 { font-size: 1rem; font-weight: 600; color: #495057; margin: 1.1rem 0 .4rem; }
    .report p, .report li { margin-bottom: .4rem; }
    .report ul { padding-left: 1.25rem; }
    .report img { max-width: 100%; height: auto; display: block; margin: .5rem auto; }
    .report hr { margin: 2rem 0; border-top: 1px solid #e6e8ec; }
    .report code { background: #f1f3f5; padding: .1rem .35rem; border-radius: 4px; font-size: .9em; }
    .report .table-responsive { margin: 1rem 0; }
    .report table { width: 100%; margin-bottom: 0; }
    .report th { background: #f8f9fa; white-space: nowrap; }
    .report .mermaid { text-align: center; margin: 1.25rem 0; }
    .report .mermaid svg { max-width: 460px !important; height: auto; }

    /* ---- hamburger nav modal ---- */
    .nav-modal-link {
      display: flex; align-items: center; gap: .85rem;
      padding: .9rem 1rem; border-radius: 10px; text-decoration: none;
      color: #212529; border: 1px solid #e6e8ec; background: #fff;
      transition: background .12s ease, border-color .12s ease;
    }
    .nav-modal-link:hover, .nav-modal-link:focus { background: #f1f3f5; border-color: #ced4da; color: #212529; }
    .nav-modal-link.active { background: #e7f1ff; border-color: #9ec5fe; color: #0a58ca; }
    .nav-modal-link .nav-ico {
      width: 38px; height: 38px; flex: 0 0 38px; border-radius: 9px;
      display: grid; place-items: center; font-size: 1.05rem; background: #f1f3f5;
    }
    .nav-modal-link.active .nav-ico { background: #cfe2ff; }
    .nav-modal-link .nav-sub { font-size: .78rem; color: #6c757d; }
    .nav-modal-link.active .nav-sub { color: #0a58ca; opacity: .85; }
    .hamburger-btn { border-color: rgba(255,255,255,.35); }

    /* ---- collapsible metric containers (analysis view) ---- */
    .m-section { border: 1px solid #e6e8ec; border-radius: 10px; background: #fff; margin-bottom: .75rem; overflow: hidden; }
    .m-head {
      width: 100%; border: 0; background: #fff; text-align: left;
      padding: .8rem 1rem; display: flex; align-items: center; gap: .65rem;
      font-weight: 600; font-size: .95rem; color: #212529;
    }
    .m-head:hover { background: #f8f9fa; }
    .m-head .chev { margin-left: auto; transition: transform .18s ease; color: #adb5bd; flex: 0 0 auto; }
    .m-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
    .m-head .m-sub { font-weight: 400; font-size: .8rem; color: #6c757d; }
    .m-body { padding: 0 1rem 1rem; }
    .m-ico { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 8px; display: grid; place-items: center; font-size: .9rem; background: #f1f3f5; }

    .kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .6rem; }
    .kv {
      border: 1px solid #eceef1; border-radius: 8px; padding: .55rem .7rem; background: #fbfcfd;
      min-width: 0;
    }
    .kv .k { font-size: .72rem; color: #6c757d; text-transform: uppercase; letter-spacing: .3px;
             display: flex; align-items: center; gap: .3rem; }
    .kv .v { font-size: 1.12rem; font-weight: 600; color: #212529; word-break: break-word; }
    .kv .v.na { color: #adb5bd; font-weight: 500; font-size: .95rem; }
    .kv .hint { font-size: .7rem; color: #868e96; margin-top: .1rem; line-height: 1.3; }

    .src-tag { font-size: .62rem; padding: .1rem .35rem; border-radius: 4px; font-weight: 600;
               text-transform: uppercase; letter-spacing: .3px; }
    .src-measured { background: #d1e7dd; color: #0f5132; }
    .src-provider_reported { background: #cff4fc; color: #055160; }
    .src-analytic_model { background: #fff3cd; color: #664d03; }
    .src-unavailable { background: #f8d7da; color: #842029; }

    .unavail-note { border: 1px dashed #dee2e6; border-radius: 8px; padding: .7rem .85rem;
                    background: #fbfcfd; color: #6c757d; font-size: .85rem; }
    .cfg-chip { display: inline-flex; align-items: center; gap: .3rem; font-size: .74rem;
                background: #eef1f4; border: 1px solid #dde1e6; border-radius: 20px;
                padding: .16rem .6rem; margin: 0 .25rem .3rem 0; font-family: SFMono-Regular, Menlo, monospace; }
    .cfg-chip.on { background: #d1e7dd; border-color: #a3cfbb; color: #0f5132; }

    /* Horizontal-overflow guard. A single wide child (button group, table,
       long token string) otherwise widens the whole document on a phone and
       clips the navbar - including the hamburger. */
    /* `clip`, not `hidden`. overflow-x:hidden turns the element into a scroll
       container, and position:sticky anchors to its nearest scrolling
       ancestor — so a hidden <body> silently breaks the sticky navbar.
       overflow-x:clip suppresses the same overflow without creating one. */
    html, body { max-width: 100%; overflow-x: clip; }
    @supports not (overflow-x: clip) {
      /* Older engines: keep the horizontal-overflow guard off the scroll
         ancestors so sticky still works, and contain it at the wrapper. */
      html, body { overflow-x: visible; }
      main { overflow-x: hidden; }
    }
    .quick-select-scroll {
      overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch;
      scrollbar-width: thin; padding-bottom: 2px;
    }
    .quick-select-scroll::-webkit-scrollbar { height: 4px; }
    .quick-select-scroll::-webkit-scrollbar-thumb { background: #ced4da; border-radius: 2px; }
    .table-responsive { max-width: 100%; }
    pre, code { overflow-wrap: anywhere; }

    .min-w-0 { min-width: 0; }
    .cat-label { font-size: .82rem; line-height: 1.15; }

    /* Sticky navigation. z-index sits below Bootstrap's modal (1055) so the
       nav modal still overlays it correctly. */
    .navbar.sticky-nav { position: sticky; top: 0; z-index: 1030; }

    /* Back-to-top. Hidden until the page is scrolled, so it never covers
       content on a short page. */
    #to-top {
      position: fixed; right: 1rem; bottom: 1rem; z-index: 1020;
      width: 42px; height: 42px; border-radius: 50%;
      display: none; align-items: center; justify-content: center;
      border: 1px solid #ced4da; background: rgba(255,255,255,.94);
      color: #495057; box-shadow: 0 2px 10px rgba(0,0,0,.12);
      cursor: pointer; padding: 0;
    }
    #to-top:hover { background: #fff; color: #0d6efd; border-color: #9ec5fe; }
    #to-top.show { display: flex; }
    @media (max-width: 576px) { #to-top { right: .7rem; bottom: .7rem; } }

    @media (max-width: 576px) {
      /* Two subject categories per row: the checkbox stays on its own line
         above the label so neither gets squeezed at ~180px of column width. */
      .cat-head { flex-wrap: wrap; row-gap: .15rem; }
      .cat-head .form-check { margin-bottom: 0; }
      .cat-label { font-size: .78rem; }
      .m-sub { font-size: .7rem; }
      .kv-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: .45rem; }
      .kv .v { font-size: 1rem; }
      .m-head { padding: .7rem .8rem; font-size: .9rem; }
      .m-body { padding: 0 .8rem .8rem; }
      main { padding-left: .75rem; padding-right: .75rem; }
      .table-responsive table { font-size: .82rem; }
      h3 { font-size: 1.35rem; }
      .metric-value { font-size: 1.35rem; }
      .terminal { height: 160px; font-size: .72rem; }
      .nav-modal-link { padding: .8rem .85rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark sticky-nav">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">SLM Benchmark</a>
      <div class="d-flex align-items-center gap-2">
        <span class="d-none d-md-inline text-secondary small">{% block nav_current %}{% endblock %}</span>
        <button class="btn btn-outline-light btn-sm hamburger-btn" type="button"
                data-bs-toggle="modal" data-bs-target="#navModal" aria-label="Open navigation menu">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
            <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- Navigation modal: single tap-target list, works identically on phone and desktop -->
  <div class="modal fade" id="navModal" tabindex="-1" aria-labelledby="navModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="navModalLabel">Navigate</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body d-grid gap-2">
          <a class="nav-modal-link {% block navm_home %}{% endblock %}" href="{{ url_for('index') }}">
            <span class="nav-ico">📖</span>
            <span><span class="d-block fw-semibold">LAMBADA</span>
                  <span class="nav-sub">Last-word prediction over long context</span></span>
          </a>
          <a class="nav-modal-link {% block navm_mmlu %}{% endblock %}" href="{{ url_for('mmlu') }}">
            <span class="nav-ico">🎓</span>
            <span><span class="d-block fw-semibold">MMLU</span>
                  <span class="nav-sub">57-subject knowledge &amp; reasoning</span></span>
          </a>
          <a class="nav-modal-link {% block navm_history %}{% endblock %}" href="{{ url_for('history') }}">
            <span class="nav-ico">🕘</span>
            <span><span class="d-block fw-semibold">History</span>
                  <span class="nav-sub">Saved runs with full stage 1-9 analysis</span></span>
          </a>
          <a class="nav-modal-link {% block navm_docs %}{% endblock %}" href="{{ url_for('docs') }}">
            <span class="nav-ico">📄</span>
            <span><span class="d-block fw-semibold">Docs</span>
                  <span class="nav-sub">Full evaluation report</span></span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <button id="to-top" type="button" aria-label="Back to top" title="Back to top">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
      <path fill-rule="evenodd" d="M8 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L7.5 2.707V14.5a.5.5 0 0 0 .5.5"/>
    </svg>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Back-to-top: revealed once the page has scrolled a screenful.
    (function () {
      const btn = document.getElementById('to-top');
      if (!btn) return;
      const toggle = () => btn.classList.toggle('show', window.scrollY > 300);
      window.addEventListener('scroll', toggle, { passive: true });
      toggle();
      btn.addEventListener('click', () =>
        window.scrollTo({ top: 0, behavior: 'smooth' }));
    })();
  </script>
  <script>const SCRIPT_ROOT = "{{ request.script_root }}";</script>
  {% block scripts %}{% endblock %}
</body>
</html>
