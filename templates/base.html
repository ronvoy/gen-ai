<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LAMBADA Benchmark{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f7f8fa; }
    .navbar-brand { font-weight: 600; letter-spacing: .2px; }
    main { max-width: 1100px; }
    .card { border: 1px solid #e6e8ec; }
    .metric-value { font-size: 1.6rem; font-weight: 600; }
    .metric-label { color: #6c757d; font-size: .85rem; }
    pre code { display: block; padding: 1rem; background: #f1f3f5; border-radius: 6px; overflow-x: auto; }
    .report table { width: 100%; }
    .report img { max-width: 100%; height: auto; }
    .report .mermaid { text-align: center; margin: 1rem 0; }
    .report .mermaid svg { max-width: 460px !important; height: auto; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">LAMBADA Benchmark</a>
      <div class="navbar-nav">
        <a class="nav-link {% block nav_home %}{% endblock %}" href="/">Benchmark</a>
        <a class="nav-link {% block nav_history %}{% endblock %}" href="/history">History</a>
        <a class="nav-link {% block nav_docs %}{% endblock %}" href="/docs">Docs</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
